# Pull requests → run the eval against what is live. No secret needed.
# (New items in the PR are not live yet, so their cases will miss until the
# PR merges and sync runs — the check shows you which ones.)
name: eval
on:
  pull_request:
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/eval.mjs
